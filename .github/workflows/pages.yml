# Publie la version iPad (app installable, hors ligne) sur GitHub Pages.
# À lancer à la main : onglet Actions → « Publier l'app iPad » → Run workflow.
# Prérequis : Settings → Pages → Source = « GitHub Actions ».
name: Publier l'app iPad

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:pwa
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pwa

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
